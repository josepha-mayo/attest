<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Attest tour — ten beats, all real</title>
<meta name="description" content="A self-playing walkthrough of Attest's verification story — every frame is the live artifact, not a screenshot.">
<meta property="og:title" content="The Attest tour — ten beats, all real">
<meta property="og:description" content="Self-playing walkthrough: signed packs verify, doctored packs fail, and judges can commit the forgery themselves — every frame a live artifact.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://josepha-mayo.github.io/attest/og-image.png">
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;margin:0;color:#1c1c1e;background:#fafafa}
.wrap{display:flex;min-height:100vh}
.side{width:360px;flex:0 0 360px;padding:1.6rem 1.4rem;border-right:1px solid #e4e4e7;
  display:flex;flex-direction:column;gap:1rem;background:#fff}
.stage{flex:1;position:relative;background:#ececef}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
h1{font-size:1.35rem;margin:0}
.tag{color:#6b6b70;font-size:.9rem;margin:0}
.beat-no{color:#2563eb;font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
h2{font-size:1.15rem;margin:.2rem 0 .4rem}
.prose{font-size:.95rem;line-height:1.55}
.prose code{background:#f4f4f5;padding:.05rem .3rem;border-radius:4px;font-size:.85em}
.why{background:#eef2ff;border:1px solid #c7d2fe;border-radius:8px;padding:.55rem .8rem;font-size:.85rem}
.ctrl{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
button{border:1px solid #d4d4d8;background:#fff;border-radius:8px;padding:.45rem .9rem;
  font-size:.9rem;cursor:pointer}
button:hover{border-color:#3b82f6}
button.primary{background:#2563eb;color:#fff;border-color:#2563eb}
.dots{display:flex;gap:.3rem;flex-wrap:wrap}
.dot{width:.55rem;height:.55rem;border-radius:50%;background:#d4d4d8;cursor:pointer}
.dot.on{background:#2563eb}
.prog{height:3px;background:#e4e4e7;border-radius:2px;overflow:hidden}
.prog>i{display:block;height:100%;background:#2563eb;width:0;transition:width .2s linear}
a{color:#2563eb}
.full{font-size:.85rem}
@media (max-width:860px){
  .wrap{flex-direction:column}
  .side{width:100%;flex:none;border-right:0;border-bottom:1px solid #e4e4e7}
  .stage{min-height:70vh}
}
</style>
</head>
<body>
<main>
<div class="wrap">
<aside class="side" aria-live="polite">
  <div>
    <h1>The Attest tour</h1>
    <p class="tag">Ten beats, ~two minutes — every frame is the live artifact, not a
    screenshot. The verifier runs for real inside each panel.</p>
  </div>
  <div id="card">
    <div class="beat-no" id="bno"></div>
    <h2 id="btitle"></h2>
    <div class="prose" id="bprose"></div>
    <p class="why" id="bwhy"></p>
    <p><a class="full" id="bfull" href="#" target="_blank" rel="noopener">open this frame full-screen ↗</a></p>
  </div>
  <div class="ctrl">
    <button id="prev" type="button">← back</button>
    <button id="play" class="primary" type="button">pause</button>
    <button id="next" type="button">next →</button>
  </div>
  <div class="prog" role="progressbar" aria-hidden="true"><i id="bar"></i></div>
  <div class="dots" id="dots"></div>
</aside>
<div class="stage"><iframe id="frame" title="live artifact"></iframe></div>
</div>
<noscript><p style="padding:1rem">The tour needs JavaScript — but every beat is
a link: <a href="verify.html#sample-pack">green VERIFIED</a> ·
<a href="verify.html#sample-pack-tampered">red FAILED</a> ·
<a href="verify.html#tamper-lab">the tamper lab</a> ·
<a href="verify.html#compare-packs">two-pack compare</a> ·
<a href="verify.html#gauntlet">the gauntlet</a> ·
<a href="verify.html#anchor-demo">the OTS anchor</a> ·
<a href="demo-visit.html">the contested visit</a> ·
<a href="demo-family.html">the family link</a> ·
<a href="demo-worker.html">the worker link</a> ·
<a href="demo-receipts.html">the hash chain</a> ·
<a href="vectors.html">the corpus</a> ·
<a href="verify.html#verify-site">site attestation</a>.</p></noscript>
<script>
const BEATS=[
 {t:"What this is",u:"index.html",s:9000,
  p:`<strong>Attest</strong> replaces "he said / she said" around home-service
  visits with a signed, evidence-preserving record — Ring observations, worker
  statements, household statements, and the coordinator's conclusion kept
  <em>separate</em>, signed, and append-only.`,
  w:"Why judges care: the demo is the product — every artifact on this site verifies independently."},
 {t:"A pack verifies itself",u:"verify.html?b=2#sample-pack",s:14000,
  p:`The exported dispute pack verifies in your browser — no install, nothing
  uploaded. The green <strong>VERIFIED</strong> stamp covers signatures, the hash
  chain, the Merkle log, witness cosignatures, and a mid-history key rotation.`,
  w:"Notice the verdict hedges honestly — integrity under a key, never physical truth."},
 {t:"The same pack, one field doctored",u:"verify.html?b=3#sample-pack-tampered",s:12000,
  p:`Someone inflated the contested visit's observed span — 65.25 to 135.25 minutes, past its 90-minute schedule — inside a signed
  bundle. The red <strong>FAILED</strong> stamp names the visit and the check that
  died: <code>payload hash mismatch</code>. Click "name what changed" and the
  verifier points at the forged field itself.`,
  w:"One byte moves, the math refuses — and one more click says which byte it was."},
 {t:"Commit the forgery yourself",u:"verify.html?b=4#tamper-lab",s:12000,
  p:`The tamper lab: pick a signed field, type your own value, and the page
  rebuilds a real zip around your edit — downloadable — then refuses it. The
  adversary is you.`,
  w:"Nothing staged: the same verifier that passed the clean pack kills yours."},
 {t:"The product face",u:"demo-visit.html",s:12000,
  p:`The contested visit as a coordinator sees it: source divergence flagged,
  the worker's signed dispute, and the household's own account changing
  mid-record — first "the doorbell never rang", then a re-sent statement
  that heard it ring. Every version kept verbatim, never merged.`,
  w:"He said / she said is preserved, not adjudicated — that's the product thesis."},
 {t:"What each side sees",u:"demo-family.html",s:12000,
  p:`Scoped links carry the dispute to each side: the household gets a texted
  <code>/family/</code> link (<a href="demo-family-es.html">en español</a>) —
  view plus their own statement form; the worker gets a
  <a href="demo-worker.html"><code>/review/</code> link</a> to countersign or
  contest. Tokens are hashed at rest, expiring, revocable.`,
  w:"Three audiences, three surfaces — nobody needs a login to be heard on the record."},
 {t:"The raw layer",u:"demo-receipts.html",s:10000,
  p:`All 253 signed receipts of the demo deployment, drawn as the literal hash
  chain — every edge a real <code>prev_hash</code>. Click any row or node for a
  one-click verdict on that single receipt.`,
  w:"A judge can drill to the byte level without trusting the site."},
 {t:"The adversarial corpus",u:"vectors.html",s:10000,
  p:`36 Wycheproof-style conformance vectors ship publicly — each row a deep
  link landing on the verdict the oracle predicts. Bool/string/fractional
  <code>leaf_index</code>, padded hex, a 2⁴⁰ tree_size.`,
  w:"Two verifiers silently diverging is how a pack gets ruled valid in one room and invalid in another."},
 {t:"The site attests itself",u:"verify.html?b=8#verify-site",s:14000,
  p:`<code>site-manifest.json</code> is a signed receipt pinning the sha256 of
  every artifact we ship. One click verifies the manifest, then hashes every
  served file against it.`,
  w:"We hold the hosting surface to the same standard as the evidence: <strong>SITE VERIFIED</strong> or <strong>SITE TAMPER</strong>, drifted files named."},
 {t:"Where to go from here",u:"verify.html?b=9#verify-self",s:9000,
  p:`The verifier checking its own bytes against the pack's signed pin —
  <strong>PINNED</strong>. Beyond this tour: JUDGE.md maps every claim to its
  artifact; README runs the whole story in one terminal.`,
  w:"Thank you — records, not verdicts."}
];
const frame=document.getElementById('frame'),bno=document.getElementById('bno'),
  btitle=document.getElementById('btitle'),bprose=document.getElementById('bprose'),
  bwhy=document.getElementById('bwhy'),bfull=document.getElementById('bfull'),
  bar=document.getElementById('bar'),dots=document.getElementById('dots'),
  play=document.getElementById('play');
let i=0,timer=null,t0=Date.now();
let playing=!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
BEATS.forEach((b,k)=>{const d=document.createElement('span');d.className='dot';
  d.setAttribute('role','button');d.setAttribute('aria-label','go to beat '+(k+1));
  d.tabIndex=0;d.onclick=()=>{pause();go(k);reset();};
  d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pause();go(k);reset();}};dots.appendChild(d);});
function go(n){
  i=(n+BEATS.length)%BEATS.length;const b=BEATS[i];
  bno.textContent='beat '+(i+1)+' of '+BEATS.length;
  btitle.textContent=b.t;bprose.innerHTML=b.p;bwhy.innerHTML=b.w;
  bfull.href=b.u.replace(/\?b=\d+/,"");frame.src=b.u;
  frame.title='live artifact — '+b.t;
  [...dots.children].forEach((d,k)=>{d.classList.toggle('on',k===i);
    if(k===i)d.setAttribute('aria-current','true');else d.removeAttribute('aria-current');});
  t0=Date.now();
}
function reset(){t0=Date.now();}
function tick(){
  if(!playing){bar.style.width='0';return;}
  const b=BEATS[i],p=Math.min(1,(Date.now()-t0)/b.s);
  bar.style.width=(p*100)+'%';
  if(p>=1){go(i+1);}
  requestAnimationFrame(tick);
}
function pause(){if(playing){playing=false;play.textContent='play';bar.style.width='0';}}
document.getElementById('prev').onclick=()=>{pause();go(i-1);reset();};
document.getElementById('next').onclick=()=>{pause();go(i+1);reset();};
play.onclick=()=>{playing=!playing;play.textContent=playing?'pause':'play';
  if(playing){reset();requestAnimationFrame(tick);}};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){pause();go(i+1);reset();}
  if(e.key==='ArrowLeft'){pause();go(i-1);reset();}
  if(e.key===' '&&!e.defaultPrevented&&!e.target.closest('button,[role=button],a,input,select,textarea')){e.preventDefault();play.onclick();}
});
const m=location.hash.match(/^#(\d{1,2})$/);if(m)i=Math.min(BEATS.length-1,Math.max(0,+m[1]-1));
play.textContent=playing?'pause':'play';
go(i);requestAnimationFrame(tick);
</script>
</main>
</body>
</html>
