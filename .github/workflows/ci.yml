name: Verify prototype

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ATTEST_SUMMARIZER: template
      ATTEST_REPLAY_MODE: 'false'
      ATTEST_POLL_HISTORY_SECONDS: '0'
    steps:
      - name: Checkout Attest
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: attest
          persist-credentials: false
      - name: Checkout tested emulator revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: josepha-mayo/ring-sandbox
          ref: b3ef8fd6b0b20d53bc7d86daf43e11c82d50a791
          path: ring-sandbox
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install both source packages
        working-directory: attest
        run: >-
          python -m pip install -r requirements-dev.txt
          -e "../ring-sandbox[server]" -e ".[dev]"
      - name: Reject tracked runtime files
        working-directory: attest
        run: >-
          python -c "import subprocess; paths = subprocess.check_output(['git', 'ls-files', '--', 'data/', 'data-*/', '*.sqlite3*', '*.key', '*.pem', '.env*'], text=True); assert not paths.strip(), 'Runtime files must not be tracked'"
      - name: Lint Attest
        working-directory: attest
        run: python -m ruff check src tests
      - name: Check Attest formatting
        working-directory: attest
        run: python -m ruff format --check src tests
      - name: Test Attest including local replay servers
        working-directory: attest
        run: python -m pytest -q
      - name: Lint companion package
        working-directory: ring-sandbox
        run: python -m ruff check src tests
      - name: Test companion package
        working-directory: ring-sandbox
        run: python -m pytest -q
      - name: Build Attest wheel
        working-directory: attest
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Build companion wheel
        working-directory: ring-sandbox
        run: python -m pip wheel --no-deps . --wheel-dir dist
